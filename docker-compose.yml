name: ${COMPOSE_PROJECT_NAME:-minio}

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio}:${MINIO_VERSION:-RELEASE.2025-01-20T14-49-07Z}
    container_name: minio
    restart: unless-stopped
    command: server --console-address ":9001" /data1 /data2 /data3 /data4
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
      MINIO_PROMETHEUS_URL: ${MINIO_PROMETHEUS_URL:-}
      MINIO_PROMETHEUS_JOB_ID: ${MINIO_PROMETHEUS_JOB_ID:-minio-job}
    ports:
      - "${MINIO_API_PORT:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001"
    volumes:
      - ${MINIO_DATA_PATH:-/srv/minio}/data1:/data1
      - ${MINIO_DATA_PATH:-/srv/minio}/data2:/data2
      - ${MINIO_DATA_PATH:-/srv/minio}/data3:/data3
      - ${MINIO_DATA_PATH:-/srv/minio}/data4:/data4
    networks:
      - minio_net
      - minio_router
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          cpus: "${MINIO_CPU_RESERVATION:-1}"
          memory: ${MINIO_MEM_RESERVATION:-1g}
        limits:
          cpus: "${MINIO_CPU_LIMIT:-2}"
          memory: ${MINIO_MEM_LIMIT:-2g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true

  # Idempotent bootstrap: creates the initial bucket if INIT_BUCKET is set.
  # Runs once and exits. Re-running `up` is safe (`mb --ignore-existing`).
  mc-init:
    image: ${MC_IMAGE:-minio/mc}:${MC_VERSION:-RELEASE.2025-01-17T23-25-50Z}
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - minio_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      INIT_BUCKET: ${INIT_BUCKET:-}
      INIT_BUCKET_POLICY: ${INIT_BUCKET_POLICY:-none}
    entrypoint: >
      /bin/sh -c '
      set -e;
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      if [ -n "$$INIT_BUCKET" ]; then
        mc mb --ignore-existing "local/$$INIT_BUCKET";
        if [ "$$INIT_BUCKET_POLICY" != "none" ]; then
          mc anonymous set "$$INIT_BUCKET_POLICY" "local/$$INIT_BUCKET";
        fi;
        echo "bucket $$INIT_BUCKET ready (policy=$$INIT_BUCKET_POLICY)";
      else
        echo "INIT_BUCKET empty, skipping";
      fi
      '
    restart: "no"

networks:
  minio_net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${NETWORK_MTU:-1500}"
  minio_router:
    external: true
    name: ${MINIO_ROUTER_NETWORK:-minio_router}
